<script>

  var nomsFormulaires = {

  };
var liensComptesRendus = {

  var params = new URLSearchParams(window.location.search);

if (envoye && nomsFormulaires[envoye]) {


  document.getElementById('nom-formulaire').textContent = nomsFormulaires[envoye];

  var lien = liensComptesRendus[envoye];

}

    document.getElementById('vue-confirmation').style.display = 'block';
  }

  function revenirAccueil() {
      history.replaceState({}, '', window.location.pathname);
    document.getElementById('vue-confirmation').style.display = 'none';
    document.getElementById('vue-principale').style.display = 'block';
  }
<script>

async function sha256(text) {
  const data = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest("SHA-256", data);

  return [...new Uint8Array(hashBuffer)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

async function login() {

  const password = document.getElementById("password").value;
  const hash = await sha256(password);

  if (window.authorizedHashes.includes(hash)) {

    sessionStorage.setItem("connecte", "oui");

    document.getElementById("login-screen").style.display = "none";
    document.getElementById("vue-principale").style.display = "flex";

  } else {
    document.getElementById("error").textContent = "Mot de passe incorrect";
  }
}

window.addEventListener("load", () => {

  if (sessionStorage.getItem("connecte") === "oui") {
    document.getElementById("login-screen").style.display = "none";
    document.getElementById("vue-principale").style.display = "flex";
  }

});

</script>
